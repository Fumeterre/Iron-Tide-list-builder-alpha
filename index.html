<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iron Tide — Army Builder</title><link rel="stylesheet" href="style.css"></head><body><header><h1>IRON TIDE <small>ARMY BUILDER</small></h1><span>Prototype V0.1 · Allemagne / URSS</span></header><main><section class="panel"><h2>Paramètres de la liste</h2><div class="grid"><label>Nom de la liste<input id="listName" value="Ma force Iron Tide"></label><label>Nation<select id="nation"><option>Allemagne</option><option>URSS</option></select></label><label>Front<select id="front"><option value="EST">Front EST</option><option value="OUEST">Front OUEST</option><option value="AFRIQUE">Afrique</option><option value="ITALIE">Italie</option><option value="FINLANDE">Finlande</option></select></label><label>Période<select id="period"><option value="Early">Early War (1939–41)</option><option value="Mid">Mid War (1942–43)</option><option value="Late" selected>Late War (1944–45)</option></select></label><label>Budget<input id="budget" type="number" min="1" value="2000"></label></div><div class="toolbar"><button id="addInf">+ Infanterie</button><button id="addCav">+ Cavalerie</button><button id="addGenie">+ Génie</button><button id="addArmor">+ Chars / véhicules</button><button id="addGun">+ Canons</button></div></section><div id="summary" class="summary"></div><div id="warnings"></div><section id="formations"></section><section class="panel"><h2>Enregistrer et partager</h2><div class="toolbar"><button id="save">Sauvegarder dans ce navigateur</button><button id="export">Exporter JSON</button><label class="filebutton">Importer JSON<input type="file" id="import" accept="application/json,.json" hidden></label><button id="print">Imprimer / PDF</button><button id="reset" class="danger">Nouvelle liste</button></div><p class="muted">Les tarifs manquants dans les OdB sont signalés : ils ne sont jamais remplacés par un prix inventé. Les valeurs 0 issues des OdB sont signalées pour vérification.</p></section></main><script src="app.js"></script></body></html>
